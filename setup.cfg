[metadata]
name = temporal-contract-analyzer
version = 0.6.10
description = Deterministic source-derived analysis for temporal contracts

[options]
python_requires = >=3.9
packages = find:

[options.packages.find]
include = temporal_contract_analyzer*

[options.package_data]
temporal_contract_analyzer = web/*.html, web/*.js, web/*.css, contract-taxonomy.json, contract-reminders.json, javascript/*.cjs, javascript/package*.json, prompts/*.md, _session_runtime/*.py, _session_runtime/*.json, _session_runtime/*.toml

[options.entry_points]
console_scripts =
    temporal-contract-analyzer = temporal_contract_analyzer.cli:main
