<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporal Contracts · 报告库</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">T<span>Temporal Contracts<small>本地研究报告库</small></span></a>
    <div class="top-actions"><span class="local-badge">仅本机访问</span><button id="refresh" class="quiet">刷新</button><button id="new-scan" class="primary">＋ 新建扫描</button></div>
  </header>
  <div id="notice" class="notice hidden" role="alert"></div>
  <main class="workspace">
    <aside class="library">
      <div class="section-heading"><h1>报告库</h1><span id="total" class="count">—</span></div>
      <p class="muted intro">保存每次分析，追踪同一份证据。</p>
      <label class="field"><span>搜索项目、任务或规则</span><input id="search" type="search" placeholder="输入关键词…"></label>
      <div class="filter-grid">
        <label class="field"><span>解析状态</span><select id="status"><option value="">全部状态</option><option value="parsed">范围内解析完成</option><option value="partial">部分解析</option><option value="failed">扫描失败</option><option value="empty">没有源码</option></select></label>
        <label class="field"><span>触发来源</span><select id="origin"><option value="">全部来源</option><option value="vscode">VS Code</option><option value="codex">Codex</option><option value="cli">CLI</option><option value="web">浏览页面</option></select></label>
      </div>
      <div id="report-list" class="report-list" aria-label="历史报告"></div>
      <div class="pagination"><button id="previous" class="quiet">上一页</button><span id="page-label"></span><button id="next" class="quiet">下一页</button></div>
      <footer class="store-note"><span>归档位置</span><code id="store-path">正在连接…</code><span id="version"></span></footer>
    </aside>
    <section class="detail" id="detail" aria-live="polite">
      <div class="empty-state"><span class="eyebrow">REPORT ARCHIVE</span><h2>让每一次分析都可以回看</h2><p>选择一份报告，查看边界审查卡、源码引用和核查记录。<br>先检查跨越的边界与受影响的效果，通过源码上下文补充定义与调用线索。</p><p class="muted">规则提示需要人工核查；没有命中不代表安全。</p></div>
    </section>
  </main>
  <dialog id="scan-dialog">
    <form id="scan-form">
      <div class="section-heading"><h2>新建归档扫描</h2><button type="button" id="close-scan" class="quiet" aria-label="关闭">✕</button></div>
      <p class="muted">读取已保存的源码，生成报告及输入快照。不会执行或修改项目。</p>
      <label class="field"><span>项目目录或源码文件的绝对路径 *</span><input name="candidate" required placeholder="/path/to/vue-project" autocomplete="off"></label>
      <label class="field"><span>项目名称（可选）</span><input name="project" placeholder="默认使用目录名称"></label>
      <label class="field"><span>本次记录名称（可选）</span><input name="label" placeholder="例如：修正组件销毁后的异步回调"></label>
      <label class="field"><span>研究任务 ID（可选）</span><input name="task_id" placeholder="用于关联研究任务"></label>
      <input name="parent_report_id" type="hidden">
      <p id="scan-parent" class="muted"></p><p id="scan-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button id="scan-submit" type="submit" class="primary">扫描并归档</button></div>
    </form>
  </dialog>
</body>
</html>
