<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Experience Review · Temporal Contracts</title>
  <link rel="stylesheet" href="/memory-review.css">
  <script src="/memory-review.js" defer></script>
</head>
<body>
  <header><span class="mark">τ</span><div><p class="eyebrow">TEMPORAL CONTRACTS / EXPERIENCE MEMORY</p><h1>Experience Review</h1></div><span class="local">Local only</span></header>
  <main>
    <aside><h2>Review queue</h2><p id="store" class="muted"></p><p id="counts" class="meta"></p><label for="review-filter">Show</label><select id="review-filter"><option value="all">All versions</option><option value="pending">Pending</option><option value="reviewed">Reviewed</option></select><div id="library"></div></aside>
    <section id="detail"><p class="empty">Select a version to inspect its rules and evidence.</p></section>
  </main>
  <p id="message" role="status" aria-live="polite"></p>
  <dialog id="evidence"><div class="dialog-heading"><h2 id="evidence-title">Source evidence</h2><button id="close-evidence" type="button">Close</button></div><div id="evidence-body"></div></dialog>
</body>
</html>
