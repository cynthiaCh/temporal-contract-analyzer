<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporal Contracts · Codex 实验</title>
  <link rel="stylesheet" href="/style.css"><script src="/experiments.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">T<span>Temporal Contracts<small>Codex 实验工作台</small></span></a>
    <div class="top-actions"><a class="link-button" href="/">报告库</a><button id="new-experiment" class="quiet">选择案例</button></div>
  </header>
  <div id="notice" class="notice hidden" role="alert"></div>
  <main class="workspace experiment-workspace">
    <aside class="library">
      <div class="section-heading"><h1>选择案例</h1><span id="case-count" class="count">—</span></div>
      <label class="field"><span>搜索案例</span><input id="case-search" type="search" placeholder="名称、语言…"></label>
      <div id="case-list" class="case-list" aria-label="案例列表"><p class="muted">正在读取 bench 案例…</p></div>
      <label class="field"><span>模型</span><select id="model" aria-label="模型"><option value="">本地 Codex 默认配置</option></select></label>
      <p id="model-note" class="muted">仍使用本机 Codex 和本地登录。</p>
      <details class="experiment-advanced"><summary>高级设置</summary>
        <div class="filter-grid">
          <label id="effort-field" class="field" hidden><span>推理强度</span><select id="effort" aria-label="推理强度"></select></label>
          <label class="field"><span>重复次数</span><input id="repeats" type="number" min="1" max="3" value="1"></label>
        </div>
        <label class="field"><span>每次超时（秒）</span><input id="timeout" type="number" min="10" max="3600" value="600"></label>
        <fieldset class="condition-picker"><legend>报告条件</legend>
          <label><input type="checkbox" name="condition" value="none" checked> A · 无报告</label>
          <label><input type="checkbox" name="condition" value="locations"> B · 位置</label>
          <label><input type="checkbox" name="condition" value="facts"> C · 事实</label>
          <label><input type="checkbox" name="condition" value="review" checked> D · 审查报告</label>
          <label><input type="checkbox" name="condition" value="audit"> E · 通用提示</label>
          <label><input type="checkbox" name="condition" value="risk"> F · 提示＋信号</label>
          <label><input type="checkbox" name="condition" value="audit_review"> G · 提示＋报告</label>
        </fieldset>
      </details>
      <button id="run-selected" class="primary run-selected" disabled>运行实验</button>
      <p id="run-summary" class="muted">选择案例后运行。</p>
      <details class="experiment-history"><summary>历史实验 <span id="experiment-count" class="count">—</span></summary><div id="experiment-list" class="report-list" aria-label="实验列表"></div></details>
      <details class="experiment-history"><summary>运行环境</summary><div class="store-note"><span>Codex CLI</span><code id="codex-path">正在连接…</code><span>实验归档位置</span><code id="experiment-store"></code></div></details>
    </aside>
    <section class="detail" id="experiment-detail" aria-live="polite">
      <div class="empty-state"><span class="eyebrow">CASE → LOCAL CODEX</span><h2>选案例，用本地 Codex 运行。</h2><p>案例代码和维护任务自动从 bench 读取。默认比较无报告与审查报告两组，分别在独立副本中运行 Codex。</p><p class="muted">运行会调用本机 Codex。完成后在这里查看回答、日志和代码改动。</p></div>
    </section>
  </main>
</body>
</html>
