<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
  <link rel="stylesheet" href="{{style}}">
  <title>My experiences</title>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">T</span><div><span class="eyebrow">TEMPOEVO</span><h1>My experiences</h1></div></div>
    <div class="header-actions"><button id="history" class="quiet">History</button><button id="reload" class="quiet">Reload</button><button id="choose" class="secondary">Choose library</button></div>
  </header>
  <div class="library-bar"><span class="library-label">LIBRARY</span><span id="store">Choose a local library to get started</span></div>
  <main>
    <aside aria-label="Experience library">
      <div class="collection-heading"><h2>Experiences <span id="count" class="count">0</span></h2><button id="new" class="secondary" title="Create an experience">+ New</button></div>
      <input id="search" type="search" placeholder="Search your library…" aria-label="Search experiences">
      <select id="category" aria-label="Category"><option value="">All categories</option></select>
      <nav id="list" aria-label="Experiences"></nav>
      <p class="sidebar-note">Your knowledge, ready to reuse.</p>
    </aside>
    <section class="workspace" aria-label="Experience editor">
      <form id="editor">
        <div class="editor-heading"><span id="editor-kind" class="eyebrow">NEW EXPERIENCE</span><span id="dirty" role="status"></span></div>
        <p id="identity"></p>
        <p id="notice"></p>
        <div id="fields"></div>
        <footer><button id="save" type="submit">Save experience</button><span class="save-hint">Saved locally to your library</span><button id="delete" type="button" class="danger quiet">Delete</button></footer>
      </form>
      <div id="history-list" hidden></div>
    </section>
  </main>
  <div class="status-bar"><span id="message" role="status" aria-live="polite">Choose a library, or open an existing one.</span></div>
  <script nonce="{{nonce}}" src="{{script}}"></script>
</body>
</html>
